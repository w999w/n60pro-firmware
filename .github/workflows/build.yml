name: Build N60 Pro 25.12 2GB
on:
  # 每天早上 01:00（Asia/Shanghai = UTC+8）自动完整编译一次。
  # GitHub 的 cron 一律按 UTC 计算，所以这里是 17:00（前一日）。
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      full_build:
        description: '预检通过后才勾选：执行完整固件编译'
        type: boolean
        default: false
      force_rebuild:
        description: '忽略"输入未变化"判断，强制完整编译'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'scripts/**', 'config/**', '*-lock.json']
permissions:
  contents: read
concurrency:
  group: n60pro-build
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # 只把真正影响产物的输入纳入指纹：源码/feeds 锁定、包选择、准备脚本、本工作流。
      # 文档、Wiki、README 的改动不会触发重复编译。
      - name: Compute build fingerprint
        id: fp
        run: |
          files=$(git ls-files 'source-lock.json' 'feeds-lock.json' 'config/*' 'scripts/*' '.github/workflows/build.yml')
          echo "inputs:"; echo "$files" | sed 's/^/  /'
          hash=$(cat $files | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "指纹: $hash"

      # 只查询、不下载。若命中，说明同样的输入此前已成功编译过。
      # 勾选 force_rebuild 时跳过本次查询，强制走编译。
      - name: Look up an earlier successful build with identical inputs
        id: built
        if: github.event_name != 'workflow_dispatch' || inputs.force_rebuild != true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build-marker
          key: n60pro-built-${{ steps.fp.outputs.hash }}
          lookup-only: true

      - name: Decide whether to compile
        env:
          FP: ${{ steps.fp.outputs.hash }}
          HIT: ${{ steps.built.outputs.cache-hit }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "已勾选强制重建，忽略指纹命中。"
            echo "### 强制完整编译（指纹 \`$FP\`）" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HIT" = "true" ]; then
            echo "输入指纹 $FP 已有成功构建，跳过编译。"
            echo "### 跳过编译：输入未变化（指纹 \`$FP\`）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "输入有变化或从未构建，将执行完整编译。"
            echo "### 执行完整编译（指纹 \`$FP\`）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore download and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            openwrt/dl
            /home/runner/.ccache
          key: n60pro-2512-${{ runner.os }}-${{ hashFiles('*-lock.json', 'config/extra.config') }}-${{ github.run_id }}
          restore-keys: |
            n60pro-2512-${{ runner.os }}-${{ hashFiles('*-lock.json', 'config/extra.config') }}-
            n60pro-2512-${{ runner.os }}-
      - name: Build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools python3-pip rsync unzip zlib1g-dev file wget curl zstd swig xsltproc qemu-utils autoconf automake libtool pkgconf time
          df -h .
          sudo apt-get install -y ccache cmake cpio device-tree-compiler gperf help2man libgmp-dev libmpc-dev libmpfr-dev libreadline-dev libyaml-dev lld llvm ninja-build python3-ply python3-docutils python3-pyelftools re2c squashfs-tools texinfo xmlto
      - name: Prepare pinned sources and configuration
        env:
          CCACHE_MAXSIZE: 2G
          CCACHE_BASEDIR: ${{ github.workspace }}/openwrt
        run: |
          mkdir -p output
          python3 scripts/prepare.py 2>&1 | tee output/prepare.log
      - name: Download build sources
        run: |
          cd openwrt
          make download -j8 2>&1 | tee ../output/download.log
      - name: Compile
        # 定时任务且输入未变化时跳过；手动触发仍需勾选 full_build。
        if: >
          steps.built.outputs.cache-hit != 'true' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build))
        env:
          CCACHE_MAXSIZE: 2G
          CCACHE_BASEDIR: ${{ github.workspace }}/openwrt
        run: |
          cd openwrt
          make -j"$(nproc)" 2>&1 | tee ../output/build.log || make -j1 V=s 2>&1 | tee ../output/build-retry.log
      - name: Collect firmware and checksums
        if: >
          steps.built.outputs.cache-hit != 'true' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build))
        run: |
          python3 scripts/collect.py
      - name: Upload firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n60pro-25.12-2gb-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: error

      # 只有整套流程（含上传）都成功，才把该指纹标记为"已构建"。
      # 上传失败时不会写标记，下次会自动重试。
      - name: Mark these inputs as successfully built
        # 必须同时满足：编译确实执行过（schedule 或手动勾选 full_build）、且此前未命中。
        if: >
          success() && steps.built.outputs.cache-hit != 'true' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build))
        run: |
          mkdir -p .build-marker
          echo "${{ steps.fp.outputs.hash }}" > .build-marker/fingerprint
          echo "已标记指纹 ${{ steps.fp.outputs.hash }} 为构建成功。"
          echo "### 已记录指纹 \`${{ steps.fp.outputs.hash }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Save build marker
        # 强制重建时该指纹的缓存可能已存在，重复写入会报错，这里不让它影响任务结果。
        continue-on-error: true
        if: >
          success() && steps.built.outputs.cache-hit != 'true' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build))
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build-marker
          key: n60pro-built-${{ steps.fp.outputs.hash }}
